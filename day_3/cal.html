<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <h1>Advanced Calculator</h1>
        <p class="subtitle">Tap an input to use the calculator keypad.</p>
        <form id="calculator-form">
            <label for="first-number">First number</label>
            <input id="first-number" type="text" inputmode="none" placeholder="e.g. 25" readonly required autofocus>
            <label for="operator">Operation</label>
            <input id="operator" type="text" inputmode="none" placeholder="Choose an operation" readonly required aria-label="Operation">
            <label for="second-number">Second number</label>
            <input id="second-number" type="text" inputmode="none" placeholder="e.g. 10" readonly required>
            <button type="submit">Calculate</button>
        </form>
        <section class="result" aria-live="polite"><span>Result</span><output id="result">—</output></section>
    </main>

    <div class="keypad-popup" id="keypad-popup" aria-hidden="true">
        <div class="keypad-popup__backdrop" data-action="close"></div>
        <section class="keypad-panel" role="dialog" aria-modal="true" aria-labelledby="keypad-title">
            <div class="keypad-panel__header">
                <h2 style="color: black;" id="keypad-title">Calculator keypad</h2><button class="close-button" type="button" data-action="close"
                    aria-label="Close keypad">×</button>
            </div>
            <p class="active-field" id="active-field">First number</p>
            <div class="keypad" aria-label="On-screen calculator keypad">
                <button type="button" class="key key--clear" data-action="clear">AC</button><button type="button"
                    class="key" data-action="sign">±</button><button type="button" class="key key--operation"
                    data-value="%">%</button><button type="button" class="key key--operation" data-value="/">÷</button>
                <button type="button" class="key" data-value="7">7</button><button type="button" class="key"
                    data-value="8">8</button><button type="button" class="key" data-value="9">9</button><button
                    type="button" class="key key--operation" data-value="*">×</button>
                <button type="button" class="key" data-value="4">4</button><button type="button" class="key"
                    data-value="5">5</button><button type="button" class="key" data-value="6">6</button><button
                    type="button" class="key key--operation" data-value="-">−</button>
                <button type="button" class="key" data-value="1">1</button><button type="button" class="key"
                    data-value="2">2</button><button type="button" class="key" data-value="3">3</button><button
                    type="button" class="key key--operation" data-value="+">+</button>
                <button type="button" class="key" data-action="delete" aria-label="Delete last digit">⌫</button><button
                    type="button" class="key" data-value="0">0</button><button type="button" class="key"
                    data-value=".">.</button><button type="button" class="key key--done" data-action="done">Done</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
